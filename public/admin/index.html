<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客控制台登录</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    .login-container{max-width:400px;margin:100px auto;padding:2rem;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
    h1{text-align:center;margin-bottom:2rem}
    input{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #e5e7eb;border-radius:6px}
    button{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <div class="login-container">
    <h1>管理员登录</h1>
    <input type="password" id="adminToken" placeholder="输入管理员密钥">
    <button onclick="login()">登录控制台</button>
  </div>
  <script>
    function login(){
      const token = document.getElementById('adminToken').value.trim()
      localStorage.setItem('ADMIN_TOKEN', token)
      window.location.href = 'dashboard.html'
    }
  </script>
</body>
</html>
